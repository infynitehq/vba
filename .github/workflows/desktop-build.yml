name: Desktop build (reusable)

on:
  workflow_call:
    inputs:
      sign:
        description: Require platform signing credentials on macOS and Windows
        type: boolean
        default: false
      updater:
        description: Enable updater-signed artifacts (free key and release approval required; OS signing optional)
        type: boolean
        default: false
      release_tag:
        type: string
        default: ''
    secrets:
      APPLE_CERTIFICATE:
        required: false
      APPLE_CERTIFICATE_PASSWORD:
        required: false
      APPLE_SIGNING_IDENTITY:
        required: false
      APPLE_ID:
        required: false
      APPLE_PASSWORD:
        required: false
      APPLE_TEAM_ID:
        required: false
      WINDOWS_CERTIFICATE:
        required: false
      WINDOWS_CERTIFICATE_PASSWORD:
        required: false
      TAURI_SIGNING_PRIVATE_KEY:
        required: false
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD:
        required: false

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.name }}
    # Set required reviewers on release. Approval occurs BEFORE any
    # secrets are read, certificate imported, or signing command executed.
    environment: ${{ (inputs.sign || inputs.updater) && 'release' || '' }}
    env:
      RELEASE_TAG: ${{ inputs.release_tag }}
      DESKTOP_UPDATE_PUBLIC_KEY: ${{ vars.DESKTOP_UPDATE_PUBLIC_KEY }}
      DESKTOP_UPDATE_ENDPOINT: ${{ vars.DESKTOP_UPDATE_ENDPOINT }}
      DESKTOP_UPDATE_REPOSITORY: ${{ vars.DESKTOP_UPDATE_REPOSITORY }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-arm64
            os: macos-15
            target: aarch64-apple-darwin
            bundles: app,dmg
            update_target: darwin-aarch64
          - name: macos-intel
            os: macos-15-intel
            target: x86_64-apple-darwin
            bundles: app,dmg
            update_target: darwin-x86_64
          - name: windows-x64
            os: windows-2022
            target: x86_64-pc-windows-msvc
            bundles: nsis
            update_target: windows-x86_64
          - name: linux-x64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: appimage,deb
            update_target: linux-x86_64
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@9fd676a19091d4595eefd76e4bd31c97133911f1 # v4.2.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm
      - name: Linux native dependencies (WebKitGTK 4.1)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            build-essential curl wget file libssl-dev librsvg2-dev libxdo-dev \
            libwebkit2gtk-4.1-dev libayatana-appindicator3-dev \
            libfuse2 patchelf
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch, pinned
        with:
          toolchain: 1.99.1
          targets: ${{ matrix.target }}
          components: rustfmt
      - run: pnpm install --frozen-lockfile
      - name: Validate release version and prepare production updater config
        if: inputs.updater
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          pnpm release:version --check --tag "$RELEASE_TAG"
          UPDATE_CONFIG="$(node scripts/updater-config.mjs)"
          echo "UPDATE_CONFIG=$UPDATE_CONFIG" >> "$GITHUB_ENV"
      - name: Release tooling unit tests
        run: node --test tests/release/*.test.mjs
      - run: pnpm fetch-emulator
      - run: pnpm make-icons --desktop
      - run: pnpm lint
      - run: pnpm test
      - name: Check unchanged web build
        run: pnpm build
      - name: Prepare embedded desktop frontend
        run: pnpm exec vite build --mode desktop
      - name: Install desktop-UI test browser
        if: runner.os == 'Linux'
        run: pnpm exec playwright install --with-deps chromium
      - name: Desktop frontend browser tests (mock native transport)
        if: runner.os == 'Linux'
        run: pnpm test:desktop-ui
      - name: Retain desktop-UI failure evidence
        if: ${{ failure() && runner.os == 'Linux' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-ui-failure-evidence
          if-no-files-found: ignore
          retention-days: 14
          path: |
            test-results-desktop/
            playwright-report/
      - name: Rust format, check and unit tests
        run: |
          cargo fmt --manifest-path desktop/Cargo.toml --all -- --check
          cargo check --locked --manifest-path desktop/Cargo.toml --target "${{ matrix.target }}"
          cargo test --locked --manifest-path desktop/Cargo.toml --target "${{ matrix.target }}"
      - name: Build OS-unsigned installers
        if: ${{ !inputs.sign || runner.os == 'Linux' }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ inputs.updater && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ inputs.updater && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
        run: |
          args=()
          if [ -n "${UPDATE_CONFIG:-}" ]; then args+=(--config "$UPDATE_CONFIG"); fi
          pnpm desktop:build --target "${{ matrix.target }}" --bundles "${{ matrix.bundles }}" "${args[@]}"
      - name: Import macOS signing identity into an isolated keychain
        if: ${{ inputs.sign && runner.os == 'macOS' }}
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          for key in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!key}" ]; then
              echo "::error::Signed build requested, but $key is missing."
              exit 1
            fi
          done
          umask 077
          KEYCHAIN_PATH="$RUNNER_TEMP/pocket-gba-signing.keychain-db"
          CERTIFICATE_PATH="$RUNNER_TEMP/pocket-gba-signing.p12"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          python3 - <<'PY'
          import base64, json, os, pathlib, shlex, subprocess
          root = pathlib.Path(os.environ["RUNNER_TEMP"])
          original = subprocess.check_output(["security", "list-keychains", "-d", "user"], text=True)
          (root / "pocket-gba-keychains.json").write_text(json.dumps(shlex.split(original)))
          (root / "pocket-gba-signing.p12").write_bytes(
              base64.b64decode(os.environ["APPLE_CERTIFICATE"], validate=True)
          )
          PY
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -k "$KEYCHAIN_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/productbuild -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH" >/dev/null
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep -F -- "$APPLE_SIGNING_IDENTITY"
          rm -f "$CERTIFICATE_PATH"
      - name: Build signed and notarized macOS installers
        if: ${{ inputs.sign && runner.os == 'macOS' }}
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ inputs.updater && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ inputs.updater && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
        run: |
          args=()
          if [ -n "${UPDATE_CONFIG:-}" ]; then args+=(--config "$UPDATE_CONFIG"); fi
          pnpm desktop:build --target "${{ matrix.target }}" --bundles "${{ matrix.bundles }}" "${args[@]}"
          APP="desktop/target/${{ matrix.target }}/release/bundle/macos/Pocket GBA.app"
          codesign --verify --deep --strict --verbose=2 "$APP"
          spctl --assess --type execute --verbose=2 "$APP"
          xcrun stapler validate "$APP"
      - name: Remove macOS signing keychain and temporary certificate
        if: ${{ always() && inputs.sign && runner.os == 'macOS' }}
        run: |
          python3 - <<'PY'
          import os, pathlib, json, subprocess
          root = pathlib.Path(os.environ["RUNNER_TEMP"])
          original = root / "pocket-gba-keychains.json"
          try:
              if original.exists():
                  subprocess.run(
                      ["security", "list-keychains", "-d", "user", "-s", *json.loads(original.read_text())],
                      check=True,
                  )
          finally:
              keychain = root / "pocket-gba-signing.keychain-db"
              try:
                  if keychain.exists():
                      subprocess.run(["security", "delete-keychain", str(keychain)], check=True)
              finally:
                  (root / "pocket-gba-signing.p12").unlink(missing_ok=True)
                  original.unlink(missing_ok=True)
          PY
      - name: Build Authenticode-signed Windows installer
        if: ${{ inputs.sign && runner.os == 'Windows' }}
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ inputs.updater && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ inputs.updater && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (!$env:WINDOWS_CERTIFICATE -or !$env:WINDOWS_CERTIFICATE_PASSWORD) {
            throw 'Signed build requested; Windows certificate and password are required.'
          }
          $pfx = Join-Path $env:RUNNER_TEMP 'desktop-signing.pfx'
          $config = Join-Path $env:RUNNER_TEMP 'desktop-signing.json'
          $cert = $null
          try {
            [IO.File]::WriteAllBytes($pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE))
            $password = ConvertTo-SecureString $env:WINDOWS_CERTIFICATE_PASSWORD -AsPlainText -Force
            $cert = Import-PfxCertificate -FilePath $pfx -CertStoreLocation Cert:\CurrentUser\My -Password $password
            if (!$cert.HasPrivateKey) { throw 'The Windows signing certificate has no private key.' }
            @{ bundle = @{ windows = @{
              certificateThumbprint = $cert.Thumbprint
              digestAlgorithm = 'sha256'
              timestampUrl = 'http://timestamp.digicert.com'
              tsp = $true
            } } } | ConvertTo-Json -Depth 5 | Set-Content $config
            $buildArgs = @('desktop:build', '--target', '${{ matrix.target }}', '--bundles', 'nsis', '--config', $config)
            if ($env:UPDATE_CONFIG) { $buildArgs += @('--config', $env:UPDATE_CONFIG) }
            pnpm @buildArgs
            if ($LASTEXITCODE -ne 0) { throw 'Signed Windows build failed.' }
            $installers = @(Get-ChildItem 'desktop/target/${{ matrix.target }}/release/bundle/nsis/*.exe')
            if ($installers.Count -ne 1) { throw 'Expected one NSIS installer.' }
            if ((Get-AuthenticodeSignature $installers[0].FullName).Status -ne 'Valid') {
              throw 'Windows Authenticode verification failed.'
            }
          } finally {
            Remove-Item $pfx, $config -Force -ErrorAction SilentlyContinue
            if ($cert) { Remove-Item "Cert:\CurrentUser\My\$($cert.Thumbprint)" -Force -ErrorAction SilentlyContinue }
          }
      - name: Collect signed update artifacts and per-target integrity metadata
        if: inputs.updater
        env:
          BUNDLE_DIRECTORY: desktop/target/${{ matrix.target }}/release/bundle
          UPDATE_ARTIFACT_DIRECTORY: update-artifacts
          UPDATE_TARGET: ${{ matrix.update_target }}
        run: node scripts/collect-update-artifacts.mjs
      - name: Upload update artifacts (not a public feed)
        if: inputs.updater
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: update-${{ matrix.update_target }}
          if-no-files-found: error
          retention-days: 14
          path: update-artifacts/
      - name: Upload installers (not a public release)
        if: ${{ !inputs.updater }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: desktop-${{ matrix.name }}-${{ inputs.sign && runner.os != 'Linux' && 'signed' || 'unsigned' }}
          if-no-files-found: error
          retention-days: 14
          path: |
            desktop/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
            desktop/target/${{ matrix.target }}/release/bundle/nsis/*.exe
            desktop/target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            desktop/target/${{ matrix.target }}/release/bundle/deb/*.deb
