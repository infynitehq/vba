name: Desktop checks

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  desktop:
    uses: ./.github/workflows/desktop-build.yml
    with:
      sign: false
    # Deliberately no secrets: PR installers are always unsigned.
